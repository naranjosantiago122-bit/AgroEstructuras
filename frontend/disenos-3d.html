<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseños de estructuras en 3D | AgroEstructura V.2 PRO</title>
<meta name="theme-color" content="#0b1326">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tailwind.css">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{ "imports": { "three": "./js/vendor/three/three.module.js" } }</script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased min-h-screen">

<header class="w-full border-b border-border-grid/80 bg-background/90 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
    <a href="index.html" class="flex items-center gap-3" title="Ir al inicio"><img src="img/logo.png" alt="AgroEstructuras" class="h-10 w-auto"><span class="font-headline-sm text-headline-sm">Diseños en 3D</span></a>
    <a href="nuevo-proyecto.html" class="px-4 min-h-[44px] inline-flex items-center rounded-lg bg-primary hover:bg-spring-lime text-on-primary font-label-md text-label-md font-bold">Ir al cotizador</a>
  </div>
</header>

<main class="max-w-7xl mx-auto p-4 lg:p-6 grid grid-cols-1 xl:grid-cols-12 gap-6">
  <form id="formDiseno" class="xl:col-span-4 bg-surface-card rounded-xl p-5 flex flex-col gap-4 h-fit" onsubmit="return false">
    <h1 class="font-headline-md text-headline-md">Estructuras de AgroEstructuras</h1>
    <p class="ayuda">Diseños tomados de los videos de referencia. Gira la vista arrastrando; acerca con la rueda o pellizcando.</p>
    <div class="flex flex-col gap-1.5">
      <label for="dTipo" class="font-label-sm text-label-sm text-on-surface-variant">TIPO DE ESTRUCTURA</label>
      <select id="dTipo" class="campo w-full bg-surface-container-lowest text-on-surface px-3 py-2.5 rounded-lg">
        <option value="Guadua">Capilla de guadua</option>
        <option value="Cercha">Capilla en cercha (sin postes centrales)</option>
        <option value="Tubular">Metálica tubular</option>
        <option value="UnaAgua">Una sola agua</option>
        <option value="SaranCapilla">Sarán / polisombra tipo capilla</option>
      </select>
      <p id="dDescripcion" class="ayuda"></p>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1.5"><label for="dLargo" class="font-label-sm text-label-sm text-on-surface-variant">LARGO (m)</label><input id="dLargo" type="number" min="2" max="500" step="any" value="40" class="campo w-full bg-surface-container-lowest text-on-surface px-3 py-2.5 rounded-lg"></div>
      <div class="flex flex-col gap-1.5"><label for="dAncho" class="font-label-sm text-label-sm text-on-surface-variant">ANCHO POR NAVE (m)</label><input id="dAncho" type="number" min="2" max="100" step="any" value="9" class="campo w-full bg-surface-container-lowest text-on-surface px-3 py-2.5 rounded-lg"></div>
      <div class="flex flex-col gap-1.5"><label for="dNaves" class="font-label-sm text-label-sm text-on-surface-variant">NAVES</label><input id="dNaves" type="number" min="1" max="20" step="1" value="3" class="campo w-full bg-surface-container-lowest text-on-surface px-3 py-2.5 rounded-lg"></div>
      <div class="flex flex-col gap-1.5"><label for="dDist" class="font-label-sm text-label-sm text-on-surface-variant">DIST. POSTES (m)</label><input id="dDist" type="number" min="0.5" max="5" step="0.5" value="3" class="campo w-full bg-surface-container-lowest text-on-surface px-3 py-2.5 rounded-lg"></div>
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="dCanal" class="font-label-sm text-label-sm text-on-surface-variant">CANAL (opcional, con recargo)</label>
      <select id="dCanal" class="campo w-full bg-surface-container-lowest text-on-surface px-3 py-2.5 rounded-lg"><option value="0">No requiere</option><option value="0.90">0.90 m</option><option value="1.20">1.20 m</option><option value="1.50">1.50 m</option><option value="2.00">2.00 m</option></select>
    </div>
  </form>

  <section class="xl:col-span-8 bg-surface-card rounded-xl p-4 flex flex-col gap-3">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h2 id="dTitulo" class="font-headline-sm text-headline-sm"></h2>
      <div class="flex gap-2">
        <button type="button" id="dCubierta" aria-pressed="true" class="px-3 min-h-[44px] rounded-lg border border-border-grid text-on-surface-variant hover:text-on-surface font-label-md text-label-md inline-flex items-center gap-1.5"><span class="material-symbols-outlined text-[18px]">layers</span><span>Quitar cubierta</span></button>
        <button type="button" id="dReset" class="px-3 min-h-[44px] rounded-lg border border-border-grid text-on-surface-variant hover:text-on-surface font-label-md text-label-md inline-flex items-center gap-1.5"><span class="material-symbols-outlined text-[18px]">center_focus_strong</span>Vista inicial</button>
      </div>
    </div>
    <div id="dVista" class="w-full rounded-xl overflow-hidden" style="height:min(62vh,560px)"></div>
    <p id="dSinWebgl" class="hidden ayuda">Este navegador no puede mostrar 3D (WebGL desactivado).</p>
  </section>
</main>

<script src="js/calculo.js"></script>
<script type="module">
  import './js/estructura3d.js';
  const $ = (id) => document.getElementById(id);
  const DESCRIPCION = {
    Guadua: 'Postes laterales y centrales, alfardas y cumbrera de guadua; plástico a dos aguas. Canales opcionales (con recargo).',
    Cercha: 'Como la capilla, pero SIN postes centrales: el techo lo sostiene una cercha (tirante, montantes y diagonales). Precio más alto.',
    Tubular: 'Columnas y arcos metálicos con ventana cenital, tirantes con refuerzos y canales entre naves.',
    UnaAgua: 'Techo de una sola caída: postes altos y bajos y alfardas inclinadas.',
    SaranCapilla: 'Sin alfardas: postes altos y bajos y cables a lo largo, con 5 m más por cada extremo para el anclaje. Malla negra.',
  };
  const vista = AgroVista3D.crear($('dVista'));
  if (!vista) { $('dSinWebgl').classList.remove('hidden'); }
  function actualizar() {
    const p = { tipo: $('dTipo').value, largo: +$('dLargo').value, ancho: +$('dAncho').value, naves: +$('dNaves').value, distancia: +$('dDist').value, anchoCanal: $('dCanal').value };
    $('dTitulo').textContent = AgroVista3D.NOMBRES[p.tipo];
    $('dDescripcion').textContent = DESCRIPCION[p.tipo];
    $('dCanal').disabled = p.tipo === 'SaranCapilla';
    if (vista) vista.actualizar(p);
  }
  $('formDiseno').addEventListener('input', actualizar);
  $('formDiseno').addEventListener('change', actualizar);
  $('dReset').addEventListener('click', () => vista && vista.vistaInicial());
  $('dCubierta').addEventListener('click', (e) => {
    const b = e.currentTarget; const ver = !(b.getAttribute('aria-pressed') === 'true');
    b.setAttribute('aria-pressed', String(ver)); b.lastElementChild.textContent = ver ? 'Quitar cubierta' : 'Poner cubierta';
    if (vista) vista.cubierta(ver);
  });
  const tipoInicial = new URLSearchParams(location.search).get('tipo');
  if (tipoInicial && AgroVista3D.NOMBRES[tipoInicial]) $('dTipo').value = tipoInicial;
  actualizar();
</script>
</body>
</html>
