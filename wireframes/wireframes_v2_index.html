<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>AgroEstructura V.2 - Wireframes de baja fidelidad 2</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  body { background: #cfd3d6; margin: 0; padding: 24px; text-align: center; font-family: "Caveat", cursive; }
  body.solo { padding: 0; background: #fff; }
  canvas { max-width: 100%; height: auto; box-shadow: 0 4px 14px rgba(0,0,0,.35); display: block; margin: 0 auto 28px; background: #fff; }
  body.solo canvas { box-shadow: none; margin: 0; max-width: none; }

<body>
<h1>AgroEstructura V.2 – Wireframes de baja fidelidad 2</h1>
<div id="lienzos"></div>
<script>
const W = 1000, H = 740, K = 2;
const params = new URLSearchParams(location.search);
const solo = params.get("p");
if (solo) document.body.classList.add("solo");

function crear() {
  const c = document.createElement("canvas");
  c.width = W * K; c.height = H * K; c.style.width = W + "px"; c.style.height = H + "px";
  document.getElementById("lienzos").appendChild(c);
  const ctx = c.getContext("2d"); ctx.scale(K, K);
  return { c, ctx, rc: rough.canvas(c) };
}
function papel(ctx) {
  ctx.fillStyle = "#fffef8"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#dbe6f1"; ctx.lineWidth = 1;
  for (let y = 40; y < H; y += 32) { ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke(); }
  ctx.strokeStyle = "#f0c4c4"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(34, 0); ctx.lineTo(34, H); ctx.stroke();
  ctx.fillStyle = "#ddd"; [90, 350, 610].forEach(y => { ctx.beginPath(); ctx.arc(14, y, 7, 0, 7); ctx.fill(); });
}
let seed = 1;
function herr(S) {
  const { ctx, rc } = S;
  const o = (e = {}) => Object.assign({ stroke: "#3a3a46", strokeWidth: 1.6, roughness: 0.8, bowing: 0.8, disableMultiStroke: true, seed: seed++ }, e);
  const d = {
    R: (x, y, w, h, e) => rc.rectangle(x, y, w, h, o(e)),
    L: (x1, y1, x2, y2, e) => rc.line(x1, y1, x2, y2, o(e)),
    C: (x, y, r, e) => rc.circle(x, y, r, o(e)),
    T: (x, y, t, s = 22, a = "left", b = false) => { ctx.fillStyle = "#2b2b3a"; ctx.textAlign = a; ctx.font = `${b ? 700 : 500} ${s}px Caveat, 'Segoe Print', cursive`; ctx.fillText(t, x, y); },
    X(x, y, w, h, label) { this.R(x, y, w, h); this.L(x, y, x + w, y + h, { strokeWidth: 1.1 }); this.L(x + w, y, x, y + h, { strokeWidth: 1.1 });
      if (label) { ctx.font = "500 21px Caveat"; const tw = ctx.measureText(label).width + 20; ctx.fillStyle = "#fffef8"; ctx.fillRect(x + w / 2 - tw / 2, y + h / 2 - 17, tw, 28); this.T(x + w / 2, y + h / 2 + 4, label, 21, "center"); } },
    B(x, y, w, h, label, fill = true, s = 22) { this.R(x, y, w, h, fill ? { fill: "#d9d9d9", fillStyle: "solid" } : {}); this.T(x + w / 2, y + h / 2 + 7, label, s, "center", true); },
    I(x, y, w, ph, h = 28) { this.R(x, y, w, h); if (ph) this.T(x + 8, y + h / 2 + 6, ph, 18); },
    SEL(x, y, w, ph, h = 28) { this.R(x, y, w, h); this.T(x + 8, y + h / 2 + 6, ph, 18); this.T(x + w - 16, y + h / 2 + 6, "▼", 14, "center"); },
    LBL(x, y, t, s = 18) { this.T(x, y, t, s, "left", true); },
    card(x, y, w, h, title) { this.R(x, y, w, h); if (title) { this.L(x + 10, y + 10, x + 10, y + 30, { strokeWidth: 3 }); this.T(x + 20, y + 28, title, 22, "left", true); } },
    tabla(x, y, cols, rows, rh = 28) { const tw = cols.reduce((a, c) => a + c[1], 0), n = rows.length + 1;
      this.R(x, y, tw, rh * n); this.R(x, y, tw, rh, { fill: "#e4e4e4", fillStyle: "solid" });
      for (let i = 1; i < n; i++) this.L(x, y + rh * i, x + tw, y + rh * i, { strokeWidth: 1.2 });
      let cx = x; cols.forEach(([t, w], i) => { if (i) this.L(cx, y, cx, y + rh * n, { strokeWidth: 1.2 }); this.T(cx + 8, y + rh / 2 + 6, t, 19, "left", true); cx += w; });
      rows.forEach((r, ri) => { let px = x; cols.forEach(([t, w], i) => { this.T(px + 8, y + rh * (ri + 1) + rh / 2 + 6, r[i] || "", 18, i === cols.length - 1 && r.right ? "left" : "left"); px += w; }); }); },
    nav(active) {
      this.R(70, 45, 230, 40); this.T(185, 73, "AgroEstructura V.2", 25, "center", true);
      let x = 360;
      ["Centro Principal", "Nuevo Proyecto", "Inventario", "Portafolio"].forEach(l => {
        this.T(x, 72, l, 21, "left", l === active); const w = l.length * 8.6;
        if (l === active) this.L(x, 80, x + w, 80, { strokeWidth: 3 }); x += w + 28; });
      this.L(60, 98, 940, 98);
    },
  };
  return d;
}
function dibujar(titulo, fn) {
  const S = crear(); papel(S.ctx); const d = herr(S);
  d.T(60, 36, "Wireframe de baja fidelidad – " + titulo, 28, "left", true);
  d.L(60, 44, 60 + 330 + titulo.length * 11, 44, { strokeWidth: 1.2 });
  S.ctx.save(); S.ctx.translate(0, 40);
  d.R(50, 30, 900, 650, { strokeWidth: 3, roughness: 1.1 });
  fn(d); S.ctx.restore();
}
const pantallas = {
  1: ["Centro Principal", d => {

    [["Presupuestos generados", "24", "↑ +12% esta semana"], ["Eficiencia de materiales", "98.2%", "margen de error mitigado"], ["Estructura más cotizada", "Metálico Tubular", "luz libre sin postes centrales"]].forEach(([a, b, c], i) => {
      const x = 80 + i * 285; d.R(x, 215, 270, 105); d.T(x + 14, 242, a.toUpperCase(), 15, "left", true); d.T(x + 14, 285, b, i === 2 ? 28 : 38, "left", true); d.T(x + 14, 310, c, 17);

  }],
  2: ["Nuevo Proyecto (cotizador)", d => {

    const x = 86, w = 298;

    d.LBL(x, 214, "Tipo de estructura"); d.SEL(x, 220, w, "Metálico Tubular", 26);
    d.LBL(x, 268, "Largo (m)"); d.LBL(x + 160, 268, "Ancho (m)"); d.I(x, 274, 138, "50", 26); d.I(x + 160, 274, 138, "24", 26);
    d.LBL(x, 322, "Distancia postes (m)"); d.LBL(x + 160, 322, "Nro. naves"); d.I(x, 328, 138, "2.5", 26); d.I(x + 160, 328, 138, "2", 26);
    d.R(x - 4, 362, w + 8, 120); d.T(x + 4, 380, "CUBIERTA Y DESAGÜE", 17, "left", true);
    d.LBL(x + 4, 400, "Calibre plástico", 16); d.LBL(x + 160, 400, "Ancho plástico", 16); d.SEL(x + 4, 404, 130, "Calibre 6", 22); d.SEL(x + 160, 404, 130, "5.80 m", 22);
    d.LBL(x + 4, 446, "Ancho de canal", 16); d.LBL(x + 160, 446, "Calibre de canal", 16); d.SEL(x + 4, 450, 130, "No requiere", 22); d.SEL(x + 160, 450, 130, "Calibre 6", 22);
    d.LBL(x, 508, "Modalidad de cotización"); d.SEL(x, 514, w, "A Todo Costo (Mat. + Mano de Obra)", 24);
    d.LBL(x, 556, "Añadir insumos libres"); d.SEL(x, 562, 170, "Insumo guardado...", 24); d.I(x + 180, 562, 58, "Cant.", 24); d.B(x + 248, 562, 50, 24, "+", true, 22);
    d.B(x, 596, w, 34, "CALCULAR PROYECTO");
    d.card(420, 112, 520, 230, "Simulador de estructura (canvas)");
    d.R(790, 120, 140, 22, { fill: "#e4e4e4", fillStyle: "solid" }); d.T(860, 137, "Modelo: Tubular", 16, "center", true);
    d.X(436, 150, 488, 150, "vista en perspectiva de la estructura");
    d.T(680, 326, "Estructura sin postes centrales (luz libre).", 18, "center");
    d.card(420, 356, 520, 281, "Desglose de materiales y costos (BOM)");
    d.T(930, 380, "Fecha: ____", 17, "right");
    d.tabla(436, 396, [["Ítem / Componente", 210], ["Cant.", 60], ["Vr. Unitario", 110], ["Subtotal", 104]], [], 28);
    d.T(680, 470, "Ingresa los parámetros y calcula el proyecto.", 20, "center");
    d.B(520, 590, 130, 34, "Historial", false); d.B(680, 590, 150, 34, "Exportar PDF");
  }],
  3: ["Nuevo Proyecto – resultado (BOM)", d => {
    d.nav("Nuevo Proyecto");
    d.card(70, 112, 870, 150, "Simulador de estructura e ingeniería avanzada");
    d.R(790, 120, 140, 22, { fill: "#e4e4e4", fillStyle: "solid" }); d.T(860, 137, "Modelo: Tubular", 16, "center", true);
    d.X(86, 150, 838, 100, "vista en perspectiva · naves acopladas · canales");
    d.card(70, 276, 870, 360, "Desglose de materiales y costos (BOM)");
    d.T(930, 300, "Fecha: ____", 17, "right");
    d.tabla(86, 322, [["Ítem / Componente", 380], ["Cant.", 100], ["Vr. Unitario", 160], ["Subtotal (COP)", 194]], [
      ["Tubo Galvanizado 2\"x6m", "__", "$ ____", "$ ____"], ["Carevaca Sencilla", "__", "$ ____", "$ ____"], ["Carevaca Reforzada", "__", "$ ____", "$ ____"],
      ["Plástico Lechoso UV6+ Cal.__", "__", "$ ____", "$ ____"], ["Canal Cal.__ – rollo 100 m", "__", "$ ____", "$ ____"]], 28);
    d.T(760, 520, "COSTO MATERIALES:", 19, "right"); d.T(924, 520, "$ ____________", 19, "right", true);
    d.T(760, 546, "MANO DE OBRA:", 19, "right"); d.T(924, 546, "$ ____________", 19, "right", true);
    d.R(560, 556, 364, 38, { strokeWidth: 2.6 }); d.T(575, 583, "TOTAL PRESUPUESTO:", 23, "left", true); d.T(910, 583, "$ ________", 23, "right", true);
    d.B(86, 600, 140, 30, "Historial", false, 20); d.B(240, 600, 160, 30, "Exportar PDF", true, 20);
  }],
  4: ["Inventario", d => {
    d.nav("Inventario");
    d.R(80, 112, 840, 66); d.L(80, 112, 80, 178, { strokeWidth: 5 });
    d.T(104, 145, "Gestor de almacén y materiales base", 30, "left", true); d.T(104, 169, "Los precios se guardan en la memoria local del navegador.", 20);
    d.R(80, 194, 840, 100); d.T(100, 222, "+ Crear nuevo registro libre", 22, "left", true);
    d.I(100, 238, 330, "Nombre (Ej: Bulto Cemento)", 36); d.R(450, 238, 230, 36); d.T(462, 263, "$", 20, "left", true); d.T(488, 263, "Precio unitario", 18);
    d.B(700, 238, 200, 36, "Crear Insumo");
    d.R(80, 310, 840, 320); d.T(100, 340, "Materiales base y memoria dinámica", 25, "left", true); d.L(90, 350, 910, 350, { strokeWidth: 1.2 });
    const items = [["Tubo Galvanizado 2\"x6m", false], ["Poste de Guadua Tratada", false], ["Carevaca Sencilla", false], ["Carevaca Reforzada", true], ["(insumo guardado 1)", false, true], ["(insumo guardado 2)", false, true]];
    items.forEach(([t, ac, dyn], i) => { const x = 100 + (i % 3) * 270, y = 378 + Math.floor(i / 3) * 90;
      d.LBL(x, y, t, 19); d.R(x, y + 10, 240, 34); d.R(x, y + 10, 34, 34, { fill: "#d9d9d9", fillStyle: "solid" }); d.T(x + 17, y + 36, "$", 20, "center", true); d.T(x + 46, y + 35, "____", 18); if (dyn) d.T(x + 224, y + 36, "🗑", 16, "center"); });
    d.B(660, 570, 240, 40, "💾 Guardar Todo el Almacén");
    d.R(100, 578, 330, 30, { fill: "#ececec", fillStyle: "solid" }); d.T(115, 600, "✔ Precios guardados exitosamente.", 18);
  }],
  5: ["Portafolio", d => {
    d.nav("Portafolio");
    d.L(80, 130, 80, 168, { strokeWidth: 5 }); d.T(100, 160, "PORTAFOLIO DE ESTRUCTURAS", 34, "left", true);
    for (let i = 0; i < 4; i++) { const x = 80 + i * 213; d.R(x, 200, 195, 150); d.X(x, 200, 195, 150, "Foto " + (i + 1)); }
    d.T(80, 392, "* Cada tarjeta muestra una foto de un trabajo (imagen/1.jpg a imagen/4.jpg).", 21);
    d.T(80, 420, "* Si la imagen no carga, se muestra un marcador de posición con el número de foto.", 21);
  }],
};
function todo() {
  if (solo) { const [t, f] = pantallas[solo]; dibujar(t, f); }
  else Object.values(pantallas).forEach(([t, f]) => dibujar(t, f));
  document.title += " [listo]";
}
Promise.all([document.fonts.load("500 22px Caveat"), document.fonts.load("700 22px Caveat")]).then(todo, todo);
</script>
</body>
